# YOLO26s V16 — P3+P4 dual-head + per-scale CoordAtt
# ====================================================
# Changes (vs V14):
#   1. Removed P5 backbone CoordAtt — P5 detection head is gone, so P5-level
#      CoordAtt signals would require two upsampling steps to reach P3/P4,
#      losing spatial precision. P5 now only does feature extraction (SPPF→C2PSA).
#   2. Added CoordAtt[32] before the P3 detection head — directly enhances
#      120×120 spatial attention.
#   3. Added CoordAtt[32] before the P4 detection head — directly enhances
#      60×60 spatial attention.
#   4. car weight 1.3→1.8, truck weight 1.0→1.3 (configured in loss.py)
#
# Design rationale:
#   - V15 proved: compressing P5 to 128ch cannot recover car detection;
#     receptive field is not the root cause.
#   - Car miss-detection root cause re-located: insufficient P4 feature representation.
#   - Per-scale independent CoordAtt > single shared CoordAtt (avoids cross-FPN decay).
#
# Inherited from V14:
#   - imgsz=800, TAL stride=4px, class weight person×2/cycle×3
#   - P3(256ch)+P4(512ch) dual-head, no P5 detection head
#   - WIoUv3, E2ELoss, scale=0.3, close_mosaic=10

# Parameters
nc: 7 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone — P5 layer does pure feature extraction, no CoordAtt
backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]  # 9
  - [-1, 2, C2PSA, [1024]]             # 10 — CoordAtt removed, SPPF → C2PSA direct

# Head — P3+P4 dual-head, each with independent CoordAtt
head:
  # --- FPN: P5→P4 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 11
  - [[-1, 6], 1, Concat, [1]]                       # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                      # 13 (P4/16-FPN)

  # --- FPN: P4→P3 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, Concat, [1]]                       # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]]                      # 16 (P3/8-small)
  - [-1, 1, CoordAtt, [32]]                         # 17 ⭐ P3 dedicated CoordAtt

  # --- PAN: P3→P4 ---
  - [-1, 1, Conv, [256, 3, 2]]                      # 18
  - [[-1, 13], 1, Concat, [1]]                       # 19 cat FPN P4
  - [-1, 2, C3k2, [512, True]]                      # 20 (P4/16-medium)
  - [-1, 1, CoordAtt, [32]]                         # 21 ⭐ P4 dedicated CoordAtt

  # --- Detect ---
  - [[17, 21], 1, Detect, [nc]]                      # 22 P3(17)+P4(21) dual-head
